name: Android debug APK

on:
  push:
    branches:
      - arena/22d75a58-hexora-pixelfield
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "MASTER PROMPT.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-debug-apk:
    name: Import and export Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install Godot 4.4.1 and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure ephemeral Android debug signing
        shell: bash
        run: |
          set -euo pipefail
          sdk_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_path"
          test -n "${JAVA_HOME:-}"
          mkdir -p "$HOME/.config/godot" "$RUNNER_TEMP"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk_path"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/hexora-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Check Godot version
        run: godot --version

      - name: Import project and smoke-test headless startup
        shell: bash
        run: |
          set -euo pipefail
          run_logged() {
            local label="$1"
            local log_file="$RUNNER_TEMP/godot-${2}.log"
            shift 2
            local status=0
            "$@" >"$log_file" 2>&1 || status=$?
            cat "$log_file"
            if grep -E '^(ERROR:|SCRIPT ERROR:)|Parse Error' "$log_file"; then
              status=1
            fi
            if [ "$status" -ne 0 ]; then
              {
                echo "### ${label} failed (exit ${status})"
                echo '```text'
                tail -n 30 "$log_file"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              local annotation
              annotation="$(tail -n 18 "$log_file" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
              echo "::error file=.github/workflows/android-debug.yml,line=1,title=${label}::${annotation}"
              return "$status"
            fi
          }
          run_logged "Godot editor import" editor-import godot --headless --path . --editor --quit
          run_logged "Headless client boot" headless-boot godot --headless --path . --quit-after 10

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/hexora-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug" build/HEXORA-debug.apk
          test -s build/HEXORA-debug.apk
          sdk_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path is not set}}"
          "$sdk_path/build-tools/34.0.0/apksigner" verify --verbose build/HEXORA-debug.apk
          "$sdk_path/build-tools/34.0.0/aapt" dump badging build/HEXORA-debug.apk | sed -n '1p'
          sha256sum build/HEXORA-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hexora-debug-apk
          path: build/HEXORA-debug.apk
          if-no-files-found: error
          retention-days: 14
