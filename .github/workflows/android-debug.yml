name: Android debug APK

on:
  push:
    branches:
      - arena/22d75a58-hexora-pixelfield
      - arena/3af02759-hexora-pixellegends
      - arena/6919bc8f-hexora-pixellegends
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "MASTER PROMPT.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-debug-apk:
    name: Import and export Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install Godot 4.4.1 and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure ephemeral Android debug signing
        shell: bash
        run: |
          set -euo pipefail
          sdk_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_path"
          test -n "${JAVA_HOME:-}"
          mkdir -p "$HOME/.config/godot" "$RUNNER_TEMP"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk_path"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/pixellegends-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Check Godot version
        run: godot --version

      - name: Import project and smoke-test headless startup
        shell: bash
        run: |
          set -euo pipefail
          run_logged() {
            local label="$1"
            local log_file="$RUNNER_TEMP/godot-${2}.log"
            shift 2
            local status=0
            "$@" >"$log_file" 2>&1 || status=$?
            cat "$log_file"
            if grep -E '^(ERROR:|SCRIPT ERROR:)|Parse Error' "$log_file"; then
              status=1
            fi
            if [ "$status" -ne 0 ]; then
              local diagnostics
              diagnostics="$(
                {
                  grep -niE 'error|failed|warning|adb|daemon' "$log_file" || true
                  echo '--- Godot log tail ---'
                  tail -n 12 "$log_file"
                } | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'
              )"
              {
                echo "### ${label} failed (exit ${status})"
                echo '```text'
                printf '%s\n' "$diagnostics" | sed 's/%0A/\n/g; s/%0D/\r/g; s/%25/%/g'
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              local annotation="$diagnostics"
              echo "::error file=.github/workflows/android-debug.yml,line=1,title=${label}::${annotation}"
              return "$status"
            fi
          }
          run_logged "Godot editor import" editor-import godot --headless --path . --editor --quit
          run_logged "Headless client boot" headless-boot godot --headless --path . --quit-after 10

      - name: Check the entrance Settings button opens the panel
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/godot-ui-check.log"
          status=0
          godot --headless --path . res://tests/ui_check.tscn >"$log_file" 2>&1 || status=$?
          cat "$log_file"
          if [ "$status" -ne 0 ]; then
            diagnostics="$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$log_file")"
            echo "::error file=tests/headless_ui_check.gd,line=1,title=Entrance Settings check::${diagnostics}"
            exit "$status"
          fi

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/pixellegends-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          log_file="$RUNNER_TEMP/godot-android-export.log"
          status=0
          godot --headless --path . --export-debug "Android Debug" build/PixelLegends-debug.apk >"$log_file" 2>&1 || status=$?
          cat "$log_file"
          if grep -E '^(ERROR:|SCRIPT ERROR:)|Parse Error' "$log_file"; then
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            diagnostics="$(
              {
                grep -niE 'error|failed|warning|export|android|sign' "$log_file" || true
                echo '--- Godot export log tail ---'
                tail -n 20 "$log_file"
              } | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'
            )"
            {
              echo "### Android debug export failed (exit ${status})"
              echo '```text'
              printf '%s\n' "$diagnostics" | sed 's/%0A/\n/g; s/%0D/\r/g; s/%25/%/g'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error file=.github/workflows/android-debug.yml,line=1,title=Android debug export::${diagnostics}"
            exit "$status"
          fi
          if [ ! -s build/PixelLegends-debug.apk ]; then
            diagnostics="$(printf 'Godot exited with status %s, but build/PixelLegends-debug.apk is missing or empty.\n' "$status"; tail -n 25 "$log_file")"
            escaped="$(printf '%s' "$diagnostics" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error file=.github/workflows/android-debug.yml,line=1,title=Missing APK after export::${escaped}"
            exit 1
          fi
          sdk_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path is not set}}"
          verify_log="$RUNNER_TEMP/apksigner-verify.log"
          if ! "$sdk_path/build-tools/34.0.0/apksigner" verify --verbose build/PixelLegends-debug.apk >"$verify_log" 2>&1; then
            cat "$verify_log"
            escaped="$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$verify_log")"
            echo "::error file=.github/workflows/android-debug.yml,line=1,title=APK signature verification failed::${escaped}"
            exit 1
          fi
          cat "$verify_log"
          unzip -t build/PixelLegends-debug.apk >/dev/null
          badging_log="$RUNNER_TEMP/aapt2-badging.log"
          if "$sdk_path/build-tools/34.0.0/aapt2" dump badging build/PixelLegends-debug.apk >"$badging_log" 2>&1; then
            sed -n '1p' "$badging_log"
            if ! grep -Fq "android.permission.VIBRATE" "$badging_log"; then
              echo "::error file=export_presets.cfg,line=1,title=Android vibration permission missing::The exported manifest must include android.permission.VIBRATE because touch feedback invokes the device vibrator."
              exit 1
            fi
          else
            cat "$badging_log"
            escaped="$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$badging_log")"
            echo "::warning file=.github/workflows/android-debug.yml,line=1,title=APK manifest metadata inspection warning::${escaped}"
          fi
          sha256sum build/PixelLegends-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pixellegends-debug-apk
          path: build/PixelLegends-debug.apk
          if-no-files-found: error
          retention-days: 14
